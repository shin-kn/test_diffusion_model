[project]
name = "test-diffusion-model"
version = "0.1.0"
description = "1D diffusion model (U-Net + EDM) for time-series anomaly detection"
readme = "README.md"
authors = [
    { name = "shin-kn" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
]

[project.scripts]
test-diffusion-model = "test_diffusion_model:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
